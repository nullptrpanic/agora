[workspace]
resolver = "3"
members = [
    "crates/agora-core",
    "crates/agora-node",
    "crates/agora-server",
    "crates/agora-sandbox",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
tokio = { version = "1.54.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2.191"
shell-words = "1.1.1"
smb2 = "0.32.1"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
tokio-rustls = "0.26.6"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
psl = "2.1.243"
time = "0.3.55"
x509-parser = "0.18.1"
httparse = "1.10.1"
md-5 = "0.11.0"
cc = "1.9.0"
ring = "0.17.14"
tempfile = "3.27.0"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
portable-pty = "0.9.0"
tower = "0.5.3"
tokio-tungstenite = "0.30.0"

[profile.dev.package.md-5]
opt-level = 3
